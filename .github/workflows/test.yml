# The rule engine decides every gate, every size, every breach code and the
# go-live verdict. If it regresses, the HUD lies quietly rather than failing
# loudly — so the suite, the typecheck and a production build run on every
# push and every pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # No GITHUB_VAULT_TOKEN in CI: the vault step writes an empty index and
      # the build still has to succeed. The real token lives only on Vercel.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
